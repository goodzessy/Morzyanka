<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibMess - Group Messenger & Calls</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'vibm-purple': '#7c3aed',
                        'vibm-light-purple': '#a78bfa',
                        'vibm-dark-bg': '#0f0f1e',
                        'vibm-dark-sidebar': '#1a1a2e',
                        'vibm-dark-text': '#f0f0f0',
                        'vibm-light-bg': '#f9f9fb'
                    }
                }
            }
        }
    </script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/lucide-react@latest/dist/umd/lucide-react.min.js"></script>
    
    <!-- Framer Motion -->
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js" crossorigin></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>
    
    <style>
        :root {
            --vibm-purple: #7c3aed;
            --vibm-light-purple: #a78bfa;
            --vibm-dark-bg: #0f0f1e;
            --vibm-dark-sidebar: #1a1a2e;
            --vibm-dark-text: #f0f0f0;
        }

        * { font-family: 'Inter', sans-serif; }
        body { margin: 0; padding: 0; overflow: hidden; }

        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #999; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #666; }

        .icon-fallback {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            font-weight: bold;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const LANGUAGES = {

                startCall: 'Начать звонок',

                members: 'участников',
                loading: 'Подождите...',
                ok: 'Ок',
                deleteChat: 'Удалить чат',
                leaveChat: 'Покинуть чат',
                clearChat: 'Очистить чат',
                pinMessage: 'Закрепить сообщение',
                unpinMessage: 'Открепить сообщение',
                reply: 'Ответить',
                edit: 'Изменить',
                delete: 'Удалить',
                reactions: 'Реакции',
                addMember: 'Добавить участника',
                removeUser: 'Удалить пользователя',
                admin: 'Администратор',
                makeAdmin: 'Назначить администратором',
                removeAdmin: 'Убрать администратора',
                privacy: 'Приватность',
                private: 'Приватный',
                public: 'Публичный'
            }
        };

        const firebaseConfig = {
            databaseURL: "https://vibmess-default-rtdb.firebaseio.com/"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Icon Component
        const Icon = ({ name, className = "w-5 h-5" }) => {
            const icons = {
                Send: <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8m0 8l-4-2m4 2l4-2" /></svg>,
                Users: <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 4.354a4 4 0 110 8 4 4 0 010-8M3 20.5v-3.5A6 6 0 0115 11v3.5M21 20.5v-3.5A6 6 0 009 11v3.5" /></svg>,
                Phone: <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" /></svg>,
                Video: <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" /></svg>,
                Menu: <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 6h16M4 12h16M4 18h16" /></svg>,
                Search: <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>,
                X: <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" /></svg>,
                Plus: <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 4v16m8-8H4" /></svg>,
                ChevronRight: <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 5l7 7-7 7" /></svg>,
                MoreVertical: <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z" /></svg>,
                Smile: <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M14.828 14.828a4 4 0 01-5.656 0M17 17H7m10 0a10 10 0 11-20 0 10 10 0 0120 0zM9 9h.01M15 9h.01" /></svg>,
                Loader2: <svg className={`${className} animate-spin`} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>,
                Check: <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 13l4 4L19 7" /></svg>,
                Settings: <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /></svg>,
                LogOut: <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" /></svg>,
                Trash2: <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>,
                Pencil: <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" /></svg>,
                Reply: <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 10a9 9 0 0118 0v3.6c0 .75.592 1.4 1.333 1.4.741 0 1.333-.65 1.333-1.4v-3.6a11 11 0 00-22 0v3.6c0 .75.592 1.4 1.334 1.4.741 0 1.333-.65 1.333-1.4V10z" /></svg>,
                Mic: <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4" /></svg>,
                Pin: <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5.586 15H19m-12 0a1 1 0 01-1-1V5a2 2 0 012-2h6a2 2 0 012 2v9a1 1 0 01-1 1m-6 0a1 1 0 001 1h6a1 1 0 001-1m-6 0H9" /></svg>,
                Bell: <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" /></svg>,
            };
            return icons[name] || <span className={`${className} icon-fallback`}>{name[0]}</span>;
        };

        function App() {
            const [user, setUser] = useState(null);
            const [usernameInput, setUsernameInput] = useState('');
            const [passwordInput, setPasswordInput] = useState('');
            const [isRegistering, setIsRegistering] = useState(false);
            const [isLoading, setIsLoading] = useState(false);
            const [chats, setChats] = useState([]);
            const [activeChatId, setActiveChatId] = useState(null);
            const [messages, setMessages] = useState([]);
            const [allUsers, setAllUsers] = useState({});
            const messageInputRef = useRef('');
            const textareaRef = useRef(null);
            const [language, setLanguage] = useState('en');
            const [isDark, setIsDark] = useState(true);
            const [callState, setCallState] = useState('idle'); // idle, calling, connected
            const [currentCall, setCurrentCall] = useState(null);
            const [groupCallMembers, setGroupCallMembers] = useState([]);
            const [showSettings, setShowSettings] = useState(false);

            const t = LANGUAGES[language];

            const hashPassword = async (password) => {
                const msgUint8 = new TextEncoder().encode(password);
                const hashBuffer = await crypto.subtle.digest('SHA-256', msgUint8);
                const hashArray = Array.from(new Uint8Array(hashBuffer));
                return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            };

            const handleLogin = async (e) => {
                e.preventDefault();
                if (!usernameInput.trim() || !passwordInput.trim() || isLoading) return;
                
                setIsLoading(true);
                try {
                    const userId = usernameInput.toLowerCase().replace(/\s/g, '_');
                    const userRef = db.ref(`users/${userId}`);
                    const snapshot = await userRef.once('value');
                    const hashedPassword = await hashPassword(passwordInput);
                    
                    if (isRegistering) {
                        if (snapshot.exists()) {
                            alert(t.userExists);
                            setIsLoading(false);
                            return;
                        }
                        const userData = {
                            id: userId,
                            username: usernameInput,
                            password: hashedPassword,
                            language: 'en',
                            theme: 'dark'
                        };
                        await userRef.set(userData);
                        setUser(userData);
                        localStorage.setItem('vibmess_user_id', userId);
                    } else {
                        if (!snapshot.exists()) {
                            alert('User not found');
                            setIsLoading(false);
                            return;
                        }
                        const userData = snapshot.val();
                        if (userData.password !== hashedPassword && userData.password !== passwordInput) {
                            alert(t.invalidPassword);
                            setIsLoading(false);
                            return;
                        }
                        if (userData.password === passwordInput) {
                            userData.password = hashedPassword;
                            await userRef.update({ password: hashedPassword });
                        }
                        setUser(userData);
                        setLanguage(userData.language || 'en');
                        setIsDark(userData.theme === 'dark');
                        localStorage.setItem('vibmess_user_id', userId);
                    }
                } catch (error) {
                    console.error("Login error:", error);
                    alert("An error occurred during login.");
                } finally {
                    setIsLoading(false);
                }
            };

            useEffect(() => {
                const savedUserId = localStorage.getItem('vibmess_user_id');
                if (savedUserId) {
                    const userRef = db.ref(`users/${savedUserId}`);
                    userRef.once('value', (snapshot) => {
                        if (snapshot.exists()) {
                            const userData = snapshot.val();
                            setUser(userData);
                            setLanguage(userData.language || 'en');
                            setIsDark(userData.theme === 'dark');
                        }
                    });
                }
            }, []);

            useEffect(() => {
                if (!user) return;
                const usersRef = db.ref('users');
                usersRef.on('value', (snapshot) => {
                    if (snapshot.exists()) setAllUsers(snapshot.val());
                });
                return () => usersRef.off();
            }, [user?.id]);

            useEffect(() => {
                if (!user) return;
                const chatsRef = db.ref('chats');
                chatsRef.on('value', (snapshot) => {
                    const data = snapshot.val();
                    if (data) {
                        const chatList = Object.entries(data)
                            .map(([id, chat]) => ({ id, ...chat }))
                            .filter(c => c.members && c.members[user.id])
                            .sort((a, b) => (b.lastTimestamp || 0) - (a.lastTimestamp || 0));
                        setChats(chatList);
                    } else {
                        setChats([]);
                    }
                });
                return () => chatsRef.off();
            }, [user?.id]);

            useEffect(() => {
                if (!activeChatId || !user) return;
                const messagesRef = db.ref(`messages/${activeChatId}`);
                messagesRef.on('value', (snapshot) => {
                    const data = snapshot.val();
                    if (data) {
                        const msgList = Object.entries(data)
                            .map(([id, msg]) => ({ id, ...msg }))
                            .sort((a, b) => a.timestamp - b.timestamp);
                        setMessages(msgList);
                    } else {
                        setMessages([]);
                    }
                });
                return () => messagesRef.off();
            }, [activeChatId, user?.id]);

            const sendMessage = async (e) => {
                e.preventDefault();
                const inputVal = messageInputRef.current;
                if (!inputVal.trim() || !user || !activeChatId) return;

                try {
                    const messagesRef = db.ref(`messages/${activeChatId}`);
                    await messagesRef.push({
                        senderId: user.id,
                        senderName: user.username,
                        text: inputVal,
                        type: 'text',
                        timestamp: Date.now()
                    });

                    const chatRef = db.ref(`chats/${activeChatId}`);
                    await chatRef.update({
                        lastMessage: inputVal,
                        lastTimestamp: Date.now()
                    });

                    messageInputRef.current = '';
                    if (textareaRef.current) {
                        textareaRef.current.value = '';
                        textareaRef.current.style.height = 'auto';
                    }
                } catch (error) {
                    console.error("Error sending message:", error);
                }
            };

            const startGroupCall = async () => {
                const chat = chats.find(c => c.id === activeChatId);
                if (!chat || chat.type === 'private') return;
                
                setCallState('calling');
                setGroupCallMembers(Object.keys(chat.members || {}).filter(id => id !== user.id));
                setCurrentCall({ id: Date.now().toString(), name: chat.name, type: 'group' });
            };

            const endCall = () => {
                setCallState('idle');
                setCurrentCall(null);
                setGroupCallMembers([]);
            };

            const logout = () => {
                setUser(null);
                setUsernameInput('');
                setPasswordInput('');
                setIsRegistering(false);
                localStorage.removeItem('vibmess_user_id');
            };

            if (!user) {
                return (
                    <div className={`min-h-screen flex items-center justify-center ${isDark ? "bg-vibm-dark-bg text-vibm-dark-text" : "bg-vibm-light-bg"}`}>
                        <div className={`p-8 rounded-2xl shadow-2xl w-full max-w-md text-center ${isDark ? "bg-vibm-dark-sidebar" : "bg-white"}`}>
                            <div className="w-16 h-16 bg-gradient-to-br from-vibm-purple to-vibm-light-purple rounded-full flex items-center justify-center mx-auto mb-6">
                                <Icon name="Send" className="text-white w-8 h-8" />
                            </div>
                            <h1 className="text-3xl font-bold mb-2">{t.appName}</h1>
                            <p className={`mb-8 ${isDark ? "text-slate-400" : "text-slate-600"}`}>{t.enterName}</p>
                            <form onSubmit={handleLogin} className="space-y-4">
                                <input
                                    type="text"
                                    placeholder={t.username}
                                    disabled={isLoading}
                                    className={`w-full px-4 py-3 rounded-xl border focus:outline-none focus:ring-2 focus:ring-vibm-purple ${isDark ? "bg-vibm-dark-bg border-white/10" : "bg-white border-slate-200"}`}
                                    value={usernameInput}
                                    onChange={(e) => setUsernameInput(e.target.value)}
                                    autoFocus
                                />
                                <input
                                    type="password"
                                    placeholder={t.password}
                                    disabled={isLoading}
                                    className={`w-full px-4 py-3 rounded-xl border focus:outline-none focus:ring-2 focus:ring-vibm-purple ${isDark ? "bg-vibm-dark-bg border-white/10" : "bg-white border-slate-200"}`}
                                    value={passwordInput}
                                    onChange={(e) => setPasswordInput(e.target.value)}
                                />
                                <button
                                    type="submit"
                                    disabled={isLoading}
                                    className="w-full text-white py-3 rounded-xl font-semibold bg-vibm-purple hover:bg-vibm-light-purple transition-colors disabled:opacity-50"
                                >
                                    {isLoading ? <Icon name="Loader2" className="inline w-5 h-5" /> : (isRegistering ? t.register : t.login)}
                                </button>
                                <button
                                    type="button"
                                    disabled={isLoading}
                                    onClick={() => setIsRegistering(!isRegistering)}
                                    className="w-full text-vibm-purple text-sm font-medium hover:underline"
                                >
                                    {isRegistering ? t.alreadyHaveAccount : t.noAccount}
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className={`flex h-screen overflow-hidden ${isDark ? "bg-vibm-dark-bg text-vibm-dark-text dark" : "bg-vibm-light-bg"}`}>
                    {/* Sidebar */}
                    <div className={`w-80 border-r flex flex-col ${isDark ? "bg-vibm-dark-sidebar border-white/5" : "bg-white border-slate-100"}`}>
                        <div className="p-4 flex items-center gap-3 flex-shrink-0">
                            <div className="flex-1">
                                <h2 className="font-bold">{t.appName}</h2>
                                <p className="text-xs opacity-60">@{user.username}</p>
                            </div>
                            <button onClick={() => setShowSettings(true)} className="p-2 hover:bg-vibm-purple/10 rounded-full">
                                <Icon name="Settings" className="w-5 h-5" />
                            </button>
                            <button onClick={logout} className="p-2 hover:bg-red-500/10 rounded-full text-red-500">
                                <Icon name="LogOut" className="w-5 h-5" />
                            </button>
                        </div>

                        <div className="px-3 pb-3">
                            <div className="relative">
                                <Icon name="Search" className="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 opacity-50" />
                                <input type="text" placeholder={t.search} className={`w-full pl-10 pr-4 py-2 rounded-full text-sm focus:outline-none focus:ring-2 focus:ring-vibm-purple/20 ${isDark ? "bg-white/5" : "bg-slate-100"}`} />
                            </div>
                        </div>

                        <div className="flex-1 overflow-y-auto custom-scrollbar space-y-1 px-2">
                            {chats.map(chat => (
                                <button
                                    key={chat.id}
                                    onClick={() => setActiveChatId(chat.id)}
                                    className={`w-full p-3 rounded-lg text-left transition-colors ${activeChatId === chat.id ? "bg-vibm-purple/20" : `hover:${isDark ? "bg-white/5" : "bg-slate-50"}`}`}
                                >
                                    <div className="font-semibold text-sm">{chat.name}</div>
                                    <p className="text-xs opacity-60 truncate">{chat.lastMessage}</p>
                                </button>
                            ))}
                        </div>

                        <div className="p-3 border-t border-white/5 flex gap-2">
                            <button className={`flex-1 py-2 rounded-lg font-bold text-sm transition-colors ${isDark ? "bg-vibm-purple/10 text-vibm-purple hover:bg-vibm-purple/20" : "bg-vibm-purple text-white hover:bg-vibm-light-purple"}`}>
                                <Icon name="Plus" className="inline w-4 h-4 mr-1" /> {t.createGroup}
                            </button>
                        </div>
                    </div>

                    {/* Chat Area */}
                    <div className="flex-1 flex flex-col">
                        {!activeChatId ? (
                            <div className="flex-1 flex items-center justify-center">
                                <p className={`text-lg ${isDark ? "text-slate-500" : "text-slate-400"}`}>{t.selectChat}</p>
                            </div>
                        ) : (
                            <>
                                {/* Header */}
                                <div className={`h-16 flex-shrink-0 flex items-center justify-between px-4 border-b ${isDark ? "bg-vibm-dark-sidebar border-white/5" : "bg-white border-slate-100"}`}>
                                    <h2 className="font-bold">{chats.find(c => c.id === activeChatId)?.name}</h2>
                                    <div className="flex gap-2">
                                        {chats.find(c => c.id === activeChatId)?.type === 'group' && (
                                            <>
                                                <button onClick={startGroupCall} className="p-2 hover:bg-vibm-purple/10 rounded-full text-vibm-purple" title={t.groupCall}>
                                                    <Icon name="Users" className="w-5 h-5" />
                                                </button>
                                                <button className="p-2 hover:bg-vibm-purple/10 rounded-full text-vibm-purple" title={t.voiceCall}>
                                                    <Icon name="Phone" className="w-5 h-5" />
                                                </button>
                                            </>
                                        )}
                                        <button className="p-2 hover:bg-white/5 rounded-full opacity-50">
                                            <Icon name="MoreVertical" className="w-5 h-5" />
                                        </button>
                                    </div>
                                </div>

                                {/* Messages */}
                                <div className="flex-1 overflow-y-auto custom-scrollbar p-4 space-y-3">
                                    {messages.map(msg => (
                                        <div key={msg.id} className={`flex ${msg.senderId === user.id ? "justify-end" : "justify-start"}`}>
                                            <div className={`max-w-xs px-4 py-2 rounded-lg ${msg.senderId === user.id ? "bg-vibm-purple text-white" : isDark ? "bg-white/10" : "bg-slate-200"}`}>
                                                {msg.senderId !== user.id && <p className="text-xs font-bold opacity-70">{msg.senderName}</p>}
                                                <p className="text-sm">{msg.text}</p>
                                                <p className="text-xs opacity-50 mt-1">{new Date(msg.timestamp).toLocaleTimeString()}</p>
                                            </div>
                                        </div>
                                    ))}
                                </div>

                                {/* Call State */}
                                {callState !== 'idle' && (
                                    <div className={`p-4 border-t ${isDark ? "bg-vibm-dark-sidebar border-white/5" : "bg-slate-50 border-slate-100"}`}>
                                        <div className={`p-3 rounded-lg mb-3 ${isDark ? "bg-white/5" : "bg-white"}`}>
                                            <p className="text-sm font-bold mb-2">{currentCall?.name} - {t.groupCall}</p>
                                            <div className="flex flex-wrap gap-2 mb-3">
                                                {groupCallMembers.slice(0, 4).map(memberId => (
                                                    <div key={memberId} className="w-12 h-12 bg-vibm-purple rounded-full flex items-center justify-center text-white text-xs font-bold">
                                                        {allUsers[memberId]?.username?.[0] || '?'}
                                                    </div>
                                                ))}
                                            </div>
                                            <button onClick={endCall} className="w-full py-2 bg-red-500 text-white rounded-lg font-bold hover:bg-red-600">
                                                {t.endCall}
                                            </button>
                                        </div>
                                    </div>
                                )}

                                {/* Input */}
                                <form onSubmit={sendMessage} className={`p-4 border-t flex-shrink-0 ${isDark ? "bg-vibm-dark-sidebar border-white/5" : "bg-white border-slate-100"}`}>
                                    <div className={`flex gap-2 ${isDark ? "bg-white/5" : "bg-slate-50"} rounded-full px-3 py-2 focus-within:ring-2 focus-within:ring-vibm-purple/20`}>
                                        <button type="button" className="p-1 opacity-50 hover:opacity-100">
                                            <Icon name="Smile" className="w-5 h-5" />
                                        </button>
                                        <textarea
                                            ref={textareaRef}
                                            rows={1}
                                            placeholder={t.message}
                                            className="flex-1 bg-transparent border-none focus:ring-0 resize-none max-h-24 custom-scrollbar"
                                            onChange={(e) => {
                                                messageInputRef.current = e.target.value;
                                                e.target.style.height = 'auto';
                                                e.target.style.height = Math.min(e.target.scrollHeight, 96) + 'px';
                                            }}
                                        />
                                        <button type="submit" className="p-1 text-vibm-purple hover:text-vibm-light-purple">
                                            <Icon name="Send" className="w-5 h-5" />
                                        </button>
                                    </div>
                                </form>
                            </>
                        )}
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
